<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axial | Symmetry Node</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #d1d5db; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; opacity: 1; }
        .hidden-tab { display: none; }
        .audit-card { background: rgba(6, 182, 212, 0.05); border-left: 2px solid #06b6d4; padding: 15px; margin-bottom: 12px; border-radius: 0 12px 12px 0; font-size: 0.85rem; }
        .stat-box { border: 1px solid rgba(6, 182, 212, 0.2); padding: 10px; text-align: center; border-radius: 10px; }
        .highlight { color: #06b6d4; font-weight: bold; }
        .terminal-text { font-size: 0.75rem; line-height: 1.4; color: rgba(255,255,255,0.7); }
    </style>
</head>
<body class="p-4 md:p-12 flex flex-col items-center min-h-screen">

    <header class="text-center mb-8">
        <h1 class="text-3xl font-black tracking-tighter uppercase italic">Axial</h1>
        <p class="text-[9px] tracking-[0.5em] opacity-40 mt-2 uppercase text-cyan-500 font-bold">Symmetry Node // Linguistic Sovereignty</p>
    </header>

    <nav class="flex space-x-6 mb-8 text-[10px] font-bold uppercase tracking-widest opacity-60">
        <button id="btn-manifesto" onclick="switchTab('manifesto')" class="pb-2 tab-active transition-all">Manifesto</button>
        <button id="btn-axial" onclick="switchTab('axial')" class="pb-2 transition-all">Axial Audit</button>
        <button id="btn-contact" onclick="switchTab('contact')" class="pb-2 transition-all">Contact</button>
    </nav>

    <main class="glass p-6 md:p-10 max-w-3xl w-full">
        
        <div id="tab-manifesto" class="tab-content">
            <h2 class="text-xl font-bold mb-6 uppercase text-cyan-500 text-center">STRIP THE SPIN.</h2>
            <article class="text-sm leading-relaxed space-y-6">
                <p>AXIAL identifies loaded framing, corporate adjectives, and ideological bias vectors. Neutralize the signal. <span class="highlight">Audit the reality.</span></p>
                <div class="grid grid-cols-2 gap-4 mt-8">
                    <div class="stat-box"><div class="text-[10px] opacity-50">SHARD</div><div class="text-cyan-500 font-bold uppercase">Myelin</div></div>
                    <div class="stat-box"><div class="text-[10px] opacity-50">CLASS</div><div class="text-cyan-500 font-bold uppercase">Somatic</div></div>
                </div>
            </article>
        </div>

        <div id="tab-axial" class="tab-content hidden-tab">
            <div class="mb-6">
                <label class="text-[10px] uppercase tracking-widest opacity-40">Raw_Intelligence_Lake_Input</label>
                <textarea id="axial-input" placeholder="PASTE NARRATIVE STRING..." class="w-full mt-2 bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none text-xs text-white resize-none"></textarea>
                <button onclick="executeForensicAudit()" class="w-full mt-4 bg-cyan-600 text-black font-black p-4 rounded-xl hover:bg-cyan-400 transition-all uppercase tracking-widest text-xs">Audit Signal</button>
            </div>
            
            <div id="axial-output" class="space-y-6 hidden-tab">
                <div class="border-t border-white/10 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-[10px] uppercase tracking-widest text-cyan-500 font-bold">Forensic_Audit_Evidence</div>
                        <div class="text-[10px] opacity-40">Output: .SET</div>
                    </div>
                    <div id="audit-results" class="space-y-4"></div>
                </div>
                
                <div class="audit-card">
                    <div class="text-[10px] uppercase font-bold text-cyan-500 mb-2">Neutralized_Signal_Payload</div>
                    <div id="neutral-payload" class="italic text-white"></div>
                </div>
            </div>
        </div>

        <div id="tab-contact" class="tab-content hidden-tab">
             <form action="https://formspree.io/f/meenllde" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="IDENTIFIER" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white text-sm">
                <textarea name="message" placeholder="DESCRIBE OPERATION" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 outline-none text-white text-sm"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl uppercase tracking-widest text-xs">Transmit</button>
            </form>
        </div>
    </main>

    <script>
        const VECTORS = {
            "GEOPOLITICAL_PRIMING": { trigger: ["american", "western", "international community", "regime", "us"], analysis: "National identity used as a narrative anchor to prioritize agency." },
            "LINGUISTIC_FRAMING": { trigger: ["thought", "ended up", "vacation", "irony", "hero"], analysis: "Use of curiosity gaps and hero archetypes to optimize engagement." },
            "EMOTIONAL_PRIMING": { trigger: ["shocking", "crisis", "outrage", "vicious"], analysis: "Limbic system trigger to bypass analytical processing." }
        };

        function switchTab(t) {
            ['manifesto', 'axial', 'contact'].forEach(tab => {
                document.getElementById('tab-' + tab).classList.toggle('hidden-tab', tab !== t);
                document.getElementById('btn-' + tab).classList.toggle('tab-active', tab === t);
            });
        }

        function executeForensicAudit() {
            const input = document.getElementById("axial-input").value;
            const outputArea = document.getElementById("axial-output");
            const resultsDiv = document.getElementById("audit-results");
            const payloadDiv = document.getElementById("neutral-payload");

            if (!input.trim()) return;
            outputArea.classList.remove('hidden-tab');
            resultsDiv.innerHTML = "<div class='animate-pulse text-cyan-500 text-[10px] uppercase'>Sharding Data...</div>";

            setTimeout(() => {
                let html = "";
                let processedText = input;

                for (const [key, data] of Object.entries(VECTORS)) {
                    data.trigger.forEach(word => {
                        if (input.toLowerCase().includes(word)) {
                            html += `<div class="audit-card">
                                <div class="text-cyan-500 font-bold text-[9px] mb-1">Audit Trace: ${key.replace('_', ' ')}</div>
                                <div class="text-white mb-2 italic">"${word}" detected.</div>
                                <div class="terminal-text">[Analysis_Audit]: ${data.analysis}</div>
                            </div>`;
                            // Simple neutralization logic
                            processedText = processedText.replace(new RegExp(word, 'gi'), "[Neutralized]");
                        }
                    });
                }

                resultsDiv.innerHTML = html || "<div class='opacity-40 text-xs uppercase'>Signal appears neutral or undocumented.</div>";
                payloadDiv.innerText = "Audit Trace Completed. Signal Stripped for .SET Export.";
            }, 800);
        }
    </script>
</body>
</html>
