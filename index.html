<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind.Set | Sovereign AGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .glow:hover { box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); transition: 0.3s; }
    </style>
</head>
<body class="p-6 md:p-24 flex flex-col items-center">

    <header class="text-center mb-16 animate-pulse">
        <h1 class="text-5xl font-black tracking-tighter uppercase italic italic">Mind.Set</h1>
        <p class="text-xs tracking-[0.6em] opacity-40 mt-4">OFFLINE-FIRST AGI ECOSYSTEM</p>
    </header>

    <main class="glass p-8 md:p-12 max-w-2xl w-full glow">
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-4 uppercase tracking-widest text-cyan-400">The Forge</h2>
            <p class="opacity-70 leading-relaxed italic">
                "To freedom and elegance we forge our path bravely; windswept and chapped we must move on."
            </p>
        </section>

        <div class="grid grid-cols-2 gap-4 mb-12">
            <div class="p-4 border border-white/5 rounded-xl bg-white/5">
                <span class="block font-bold">AXIAL</span>
                <span class="text-[10px] opacity-40">Bias Audit</span>
            </div>
            <div class="p-4 border border-white/5 rounded-xl bg-white/5">
                <span class="block font-bold">SHARDFORGE</span>
                <span class="text-[10px] opacity-40">Data Sharding</span>
            </div>
        </div>

        <section>
            <h3 class="text-xl font-bold mb-6 uppercase tracking-widest">Inquire</h3>
            <form action="mailto:your-email@example.com" method="post" enctype="text/plain" class="space-y-4">
                <input type="text" placeholder="NAME / ENTITY" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-cyan-400">
                <input type="email" placeholder="SECURE_EMAIL" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-cyan-400">
                <textarea placeholder="NATURE OF INQUIRY" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:outline-none focus:border-cyan-400"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl hover:bg-cyan-400 transition-colors uppercase tracking-widest">
                    Submit to the Forge
                </button>
            </form>
        </section>
    </main>

    <footer class="mt-16 opacity-20 text-[10px] tracking-[0.3em] uppercase">
        &copy; 2026 Mind.Set AGI Development // San Antonio Node
    </footer>

</body>
</html>
