<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind.Set | Axial Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; opacity: 1; }
        .hidden-tab { display: none; }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
        .audit-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .audit-card:hover { border-color: #06b6d4; background: rgba(6,182,212,0.02); }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center min-h-screen">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-black tracking-tighter uppercase italic leading-none">Mind.Set</h1>
        <p class="text-[9px] tracking-[0.6em] opacity-40 mt-3 uppercase text-cyan-500">Sovereign Intelligence // Axial v2.1</p>
    </header>

    <nav class="flex space-x-8 mb-8 text-xs font-bold uppercase tracking-widest opacity-50">
        <button id="btn-forge" onclick="switchTab('forge')" class="pb-2 tab-active transition-all">The Forge</button>
        <button id="btn-axial" onclick="switchTab('axial')" class="pb-2 transition-all">Axial Audit</button>
    </nav>

    <main class="glass p-8 max-w-2xl w-full">
        
        <div id="tab-forge" class="tab-content">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center text-sm">Direct Inquiry</h2>
            <form action="https://formspree.io/f/meenllde" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="IDENTIFIER" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <input type="email" name="email" placeholder="RETURN_NODE" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <textarea name="message" placeholder="DATA STRING" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none resize-none"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl hover:bg-cyan-500 transition-all uppercase tracking-widest">Transmit</button>
            </form>
        </div>

        <div id="tab-axial" class="tab-content hidden-tab">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center text-sm">Lexical Audit Engine</h2>
            
            <div class="space-y-4">
                <textarea id="axial-input" placeholder="PASTE DATA FOR CLINICAL AUDIT..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-48 focus:border-cyan-500 outline-none resize-none text-sm"></textarea>
                <button onclick="runLocalAudit()" class="w-full border border-cyan-500 text-cyan-500 font-bold p-4 rounded-xl hover:bg-cyan-500 hover:text-black transition-all uppercase tracking-widest text-sm">Execute Audit</button>
                
                <div id="axial-output" class="mt-6 p-6 bg-black/40 border border-white/5 rounded-xl text-sm leading-relaxed text-white/80 min-h-[100px]">
                    SYSTEM_READY: Passive monitoring active.
                </div>
            </div>
        </div>
    </main>

    <script>
        const BIAS_DB = {
            "GEOPOLITICAL_FRAMING": {
                words: ["regime", "militant", "unprovoked", "freedom fighter", "surgical strike", "proxy", "unconfirmed", "disinformation", "adversary"],
                analysis: "This lexical strand is used to establish moral hierarchy. By categorizing actors as 'regimes' or 'militants' without legal definitions, the author bypasses objective reporting to enforce a specific geopolitical alignment."
            },
            "CORPORATE_LINGUISTICS": {
                words: ["synergy", "stakeholder", "disruptive", "pivotal", "alignment", "robust", "optimization", "value-added", "streamlining"],
                analysis: "These terms function as semantic camouflage. They obscure mechanical or financial processes (like resource extraction or liquidation) behind a mask of professional 'growth' logic."
            },
            "EMOTIONAL_PRIMING": {
                words: ["shocking", "outrage", "vicious", "slams", "blasts", "bombshell", "common sense", "terrifying", "unbelievable"],
                analysis: "High-entropy adjectives identified. These are designed to trigger the limbic system, forcing an emotional conclusion before the reader can process the actual data points."
            },
            "AUTHORITY_VAGUENESS": {
                words: ["experts say", "officials confirm", "studies show", "everyone knows", "unnamed sources", "well-placed", "leaked"],
                analysis: "Anonymized authority appeals detected. This structure removes accountability from the claim, requiring the reader to trust a ghost-source rather than verifiable evidence."
            }
        };

        function switchTab(t) {
            document.getElementById('tab-forge').classList.toggle('hidden-tab', t !== 'forge');
            document.getElementById('tab-axial').classList.toggle('hidden-tab', t !== 'axial');
            document.getElementById('btn-forge').classList.toggle('tab-active', t === 'forge');
            document.getElementById('btn-axial').classList.toggle('tab-active', t === 'axial');
        }

        function runLocalAudit() {
            const input = document.getElementById("axial-input");
            const output = document.getElementById("axial-output");
            const text = input.value.toLowerCase();
            
            if (!text.trim()) {
                output.innerText = "SYSTEM_WARNING: No input detected.";
                return;
            }

            let findingsHTML = "";
            let intensity = 0;

            for (const [category, data] of Object.entries(BIAS_DB)) {
                let found = data.words.filter(word => text.includes(word));
                
                if (found.length > 0) {
                    intensity += found.length;
                    findingsHTML += `
                        <div class="audit-card p-4 rounded-xl mb-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-cyan-500 font-bold tracking-tighter text-[10px] uppercase">${category}</span>
                                <span class="text-[9px] opacity-30 italic">${found.length} Match(es)</span>
                            </div>
                            <p class="text-white/90 text-xs mb-2 font-mono italic">"${found.join(', ')}"</p>
                            <p class="text-white/50 text-[10px] leading-tight font-light">${data.analysis}</p>
                        </div>
                    `;
                }
            }

            const label = intensity > 5 ? "CRITICAL" : intensity > 2 ? "ELEVATED" : "STABLE";
            
            output.innerHTML = findingsHTML ? `
                <div class="mb-6 border-b border-white/10 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-widest">Audit Result: <span class="text-cyan-500">${label}</span></h3>
                </div>
                ${findingsHTML}
                <div class="mt-6 p-4 border border-cyan-900/50 rounded-xl text-[10px] opacity-60">
                    <strong>SYSTEM_ADVICE:</strong> Lexical saturation suggests a curated narrative. Disregard adjectives and focus strictly on the sequence of events and verified entities.
                </div>
            ` : "<strong>AUDIT_COMPLETE:</strong> No identified lexical triggers. Text maintains a baseline signal-to-noise ratio.";
        }
    </script>
</body>
</html>
