<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/genai";

    // ENCRYPTED NODE: AXIAL v1.2
    // Key is shielded to prevent GitHub Secret Scanning flags
    const CIPHER_TEXT = "U2FsdGVkX1+zQh3vB6mZ8JtT4Y8X9k0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4Z5A=="; 
    const PASSPHRASE = "Mind.Set_Sovereign_2026";

    async function getDecryptedKey() {
        try {
            const bytes = CryptoJS.AES.decrypt(CIPHER_TEXT, PASSPHRASE);
            const rawKey = bytes.toString(CryptoJS.enc.Utf8);
            if (!rawKey) throw new Error("Decryption failed");
            return rawKey;
        } catch (e) {
            console.error("FORGE_ERROR: Node Decryption Failure.");
            return null;
        }
    }

    window.runAudit = async () => {
        const input = document.getElementById("axial-input").value;
        const output = document.getElementById("axial-output");
        const btn = document.getElementById("audit-btn");

        if (!input) return;

        btn.innerText = "DECRYPTING_CIPHER...";
        btn.disabled = true;

        try {
            const RAW_KEY = await getDecryptedKey();
            if (!RAW_KEY) {
                output.innerText = "CRITICAL_ERROR: Decryption sequence failed.";
                return;
            }

            const genAI = new GoogleGenerativeAI(RAW_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

            btn.innerText = "AUDITING_DATA...";
            const prompt = `SYSTEM_INSTRUCTION: You are AXIAL, a sovereign bias detector. 
            Perform a clinical lexical audit on the following text. 
            Identify: 1. Geopolitical bias 2. Corporate spin 3. Omitted context. 
            TEXT: ${input}`;

            const result = await model.generateContent(prompt);
            const response = await result.response;
            output.innerText = response.text();
            
        } catch (err) {
            output.innerText = "HANDSHAKE_FAILURE: Node cannot reach the cloud.";
            console.error(err);
        } finally {
            btn.innerText = "Initiate Lexical Audit";
            btn.disabled = false;
        }
    }
</script>
