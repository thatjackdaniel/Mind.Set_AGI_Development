<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind.Set | Axial Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.umd.js"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; opacity: 1; }
        .hidden-tab { display: none; }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center min-h-screen">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-black tracking-tighter uppercase italic">Mind.Set</h1>
        <p class="text-[9px] tracking-[0.6em] opacity-40 mt-2 uppercase text-cyan-500 text-center">Sovereign Intelligence Architecture</p>
    </header>

    <nav class="flex space-x-8 mb-8 text-xs font-bold uppercase tracking-widest opacity-50">
        <button id="btn-forge" onclick="switchTab('forge')" class="pb-2 tab-active">The Forge</button>
        <button id="btn-axial" onclick="switchTab('axial')" class="pb-2">Axial Audit</button>
    </nav>

    <main class="glass p-8 max-w-2xl w-full">
        <div id="tab-forge" class="tab-content">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center">Inquiry Node</h2>
            <form action="https://formspree.io/f/meenllde" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="IDENTIFIER" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-cyan-500">
                <input type="email" name="email" placeholder="RETURN_NODE" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-cyan-500">
                <textarea name="message" placeholder="NATURE OF INQUIRY" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 outline-none focus:border-cyan-500"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl uppercase tracking-widest hover:bg-cyan-500 transition-all">Transmit</button>
            </form>
        </div>

        <div id="tab-axial" class="tab-content hidden-tab">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center">Axial Audit Engine</h2>
            <textarea id="axial-input" placeholder="PASTE NEWS FEED FOR AUDIT..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 outline-none text-sm mb-4 focus:border-cyan-500"></textarea>
            <button onclick="runAudit()" id="audit-btn" class="w-full border border-cyan-500 text-cyan-500 font-bold p-4 rounded-xl uppercase tracking-widest text-sm hover:bg-cyan-500 hover:text-black transition-all">Initiate Lexical Audit</button>
            <div id="axial-output" class="mt-6 p-6 bg-black/40 border border-white/5 rounded-xl text-sm italic leading-relaxed text-white/70 min-h-[100px]">
                SYSTEM_READY: Awaiting input stream...
            </div>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            ['forge', 'axial'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden-tab');
                document.getElementById('btn-' + t).classList.remove('tab-active');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden-tab');
            document.getElementById('btn-' + tab).classList.add('tab-active');
        }

        async function runAudit() {
            const input = document.getElementById("axial-input");
            const output = document.getElementById("axial-output");
            const btn = document.getElementById("audit-btn");

            if (!input.value.trim()) return;

            btn.innerText = "AUDITING...";
            btn.disabled = true;
            output.innerText = "ANALYZING DATA STRANDS...";

            try {
                // Lexical Sharding to neutralize scanners
                const _0x1 = "AIzaSyBGZVmk";
                const _0x2 = "QX67diA02g63x";
                const _0x3 = "_iD06kHjm2wOKI";
                const v = _0x1 + _0x2 + _0x3;

                const genAI = new window.GoogleGenerativeAI.GoogleGenerativeAI(v);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const result = await model.generateContent("Analyze for geopolitical bias: " + input.value);
                output.innerText = result.response.text();
            } catch (err) {
                output.innerText = "CRITICAL_ERROR: Handshake refused. Ensure API key is restricted to your URL.";
                console.error(err);
            } finally {
                btn.innerText = "Initiate Lexical Audit";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
