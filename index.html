<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind.Set | Axial Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; opacity: 1; }
        .hidden-tab { display: none; }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center min-h-screen">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-black tracking-tighter uppercase italic leading-none">Mind.Set</h1>
        <p class="text-[9px] tracking-[0.6em] opacity-40 mt-3 uppercase text-cyan-500">Sovereign Intelligence // Offline Node</p>
    </header>

    <nav class="flex space-x-8 mb-8 text-xs font-bold uppercase tracking-widest opacity-50">
        <button id="btn-forge" onclick="switchTab('forge')" class="pb-2 tab-active transition-all">The Forge</button>
        <button id="btn-axial" onclick="switchTab('axial')" class="pb-2 transition-all">Axial Audit</button>
    </nav>

    <main class="glass p-8 max-w-2xl w-full">
        
        <div id="tab-forge" class="tab-content">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center">Inquiry Node</h2>
            <form action="https://formspree.io/f/meenllde" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="IDENTIFIER" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <input type="email" name="email" placeholder="RETURN_NODE" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <textarea name="message" placeholder="NATURE OF INQUIRY" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none resize-none"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl hover:bg-cyan-500 transition-all uppercase tracking-widest">Transmit</button>
            </form>
        </div>

        <div id="tab-axial" class="tab-content hidden-tab">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500 text-center">Axial Audit Engine</h2>
            <p class="text-[10px] opacity-40 mb-6 uppercase italic text-center">Heuristic Analysis // Geopolitical Filter</p>
            
            <div class="space-y-4">
                <textarea id="axial-input" placeholder="PASTE NEWS FEED FOR AUDIT..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-48 focus:border-cyan-500 outline-none resize-none text-sm"></textarea>
                <button onclick="runLocalAudit()" id="audit-btn" class="w-full border border-cyan-500 text-cyan-500 font-bold p-4 rounded-xl hover:bg-cyan-500 hover:text-black transition-all uppercase tracking-widest text-sm">Execute Local Audit</button>
                
                <div id="axial-output" class="mt-6 p-6 bg-black/40 border border-white/5 rounded-xl text-sm leading-relaxed text-white/80 min-h-[100px]">
                    SYSTEM_READY: Node is offline and sovereign.
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-12 opacity-20 text-[8px] tracking-[0.5em] uppercase text-center font-mono">
        &copy; 2026 Mind.Set // Sovereign Ops
    </footer>

    <script>
        // THE ANALYTIC DATABASE
        const BIAS_DB = {
            "GEOPOLITICAL_FRAMING": {
                words: ["regime", "militant", "unprovoked", "freedom fighter", "surgical strike", "proxy", "unconfirmed", "disinformation"],
                description: "Narrative framing used to designate 'Enemy' vs 'Ally' without objective evidence."
            },
            "CORPORATE_MASKING": {
                words: ["synergy", "stakeholder", "disruptive", "pivotal", "alignment", "robust", "optimization", "downsizing"],
                description: "Euphemisms designed to sanitize financial extraction or workforce reduction."
            },
            "EMOTIONAL_MANIPULATION": {
                words: ["shocking", "outrage", "vicious", "slams", "blasts", "bombshell", "common sense", "terrifying"],
                description: "High-intensity adjectives used to bypass logical reasoning and trigger a limbic response."
            },
            "AUTHORITY_APPEALS": {
                words: ["experts say", "officials confirm", "studies show", "everyone knows", "unnamed sources"],
                description: "Vague appeals to authority used to bypass the need for direct citation or proof."
            }
        };

        function switchTab(t) {
            document.getElementById('tab-forge').classList.toggle('hidden-tab', t !== 'forge');
            document.getElementById('tab-axial').classList.toggle('hidden-tab', t !== 'axial');
            document.getElementById('btn-forge').classList.toggle('tab-active', t === 'forge');
            document.getElementById('btn-axial').classList.toggle('tab-active', t === 'axial');
        }

        function runLocalAudit() {
            const inputField = document.getElementById("axial-input");
            const output = document.getElementById("axial-output");
            const text = inputField.value.toLowerCase();
            
            if (!text.trim()) {
                output.innerText = "SYSTEM_WARNING: Input stream empty.";
                return;
            }

            let findingsHTML = "";
            let intensityScore = 0;
            let categoriesFound = 0;

            for (const [category, data] of Object.entries(BIAS_DB)) {
                let matches = data.words.filter(word => text.includes(word));
                
                if (matches.length > 0) {
                    intensityScore += matches.length;
                    categoriesFound++;
                    findingsHTML += `
                        <div class="mb-4 border-l-2 border-cyan-500/30 pl-4">
                            <span class="text-cyan-500 font-bold tracking-widest text-[10px] uppercase">[${category}]</span>
                            <p class="text-white/90 text-xs mt-1 italic">"${matches.join(', ')}"</p>
                            <p class="text-white/40 text-[10px] leading-tight mt-1">${data.description}</p>
                        </div>
                    `;
                }
            }

            const label = intensityScore > 5 ? "CRITICAL" : intensityScore > 2 ? "ELEVATED" : "MODERATE";
            
            output.innerHTML = findingsHTML ? `
                <div class="border-b border-white/10 pb-4 mb-4">
                    <h3 class="text-sm font-bold uppercase">Audit Summary: ${label}</h3>
                    <p class="text-[10px] text-white/50 italic">Total Signals: ${intensityScore} // Vectors: ${categoriesFound}</p>
                </div>
                ${findingsHTML}
                <div class="mt-4 p-4 bg-white/5 border border-cyan-500/30 rounded-xl text-[10px] leading-relaxed">
                    <strong>STRATEGIC ADVICE:</strong> The text utilizes ${label.toLowerCase()} lexical framing. Cross-reference with primary raw data to neutralize the established narrative bias.
                </div>
            ` : "<strong>AUDIT COMPLETE:</strong> No clinical lexical anchors detected in local database.";
        }
    </script>
</body>
</html>
