<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind.Set | Axial Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.umd.js"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; opacity: 1; }
        .hidden-tab { display: none; }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center min-h-screen">

    <header class="text-center mb-8">
        <h1 class="text-5xl font-black tracking-tighter uppercase italic">Mind.Set</h1>
        <p class="text-[9px] tracking-[0.6em] opacity-40 mt-2 uppercase text-cyan-500">Sovereign Intelligence Architecture</p>
    </header>

    <nav class="flex space-x-8 mb-8 text-xs font-bold uppercase tracking-widest opacity-50">
        <button id="btn-forge" onclick="switchTab('forge')" class="pb-2 tab-active transition-all">The Forge</button>
        <button id="btn-axial" onclick="switchTab('axial')" class="pb-2 transition-all">Axial Audit</button>
    </nav>

    <main class="glass p-8 max-w-2xl w-full">
        
        <div id="tab-forge" class="tab-content">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500">Inquiry Node</h2>
            <form action="https://formspree.io/f/meenllde" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="IDENTIFIER" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <input type="email" name="email" placeholder="RETURN_NODE" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:border-cyan-500 outline-none">
                <textarea name="message" placeholder="NATURE OF INQUIRY" required class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none resize-none"></textarea>
                <button type="submit" class="w-full bg-white text-black font-black p-4 rounded-xl hover:bg-cyan-500 transition-all uppercase tracking-widest">Transmit</button>
            </form>
        </div>

        <div id="tab-axial" class="tab-content hidden-tab">
            <h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-cyan-500">Axial Audit Engine</h2>
            <p class="text-[10px] opacity-40 mb-6 uppercase italic">Lexical Analysis // Geopolitical Filter</p>
            
            <div class="space-y-4">
                <textarea id="axial-input" placeholder="PASTE NEWS FEED OR DATA STRING FOR AUDIT..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none resize-none text-sm"></textarea>
                <button onclick="runAudit()" id="audit-btn" class="w-full border border-cyan-500 text-cyan-500 font-bold p-4 rounded-xl hover:bg-cyan-500 hover:text-black transition-all uppercase tracking-widest text-sm">Initiate Lexical Audit</button>
                
                <div id="axial-output" class="mt-6 p-6 bg-black/40 border border-white/5 rounded-xl text-sm leading-relaxed text-white/80 min-h-[100px] whitespace-pre-wrap italic">
                    SYSTEM_READY: Awaiting input stream...
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-12 opacity-20 text-[8px] tracking-[0.5em] uppercase text-center">
        &copy; 2026 Mind.Set // Sovereign Operations
    </footer>

    <script>
        // Tab Handlers
        function switchTab(tab) {
            const tabs = ['forge', 'axial'];
            tabs.forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden-tab');
                document.getElementById('btn-' + t).classList.remove('tab-active');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden-tab');
            document.getElementById('btn-' + tab).classList.add('tab-active');
        }

        // Axial AI Logic
        async function runAudit() {
            const inputField = document.getElementById("axial-input");
            const output = document.getElementById("axial-output");
            const btn = document.getElementById("audit-btn");

            if (!inputField.value.trim()) {
                output.innerText = "SYSTEM_WARNING: No data detected in input stream.";
                return;
            }

            btn.innerText = "AUDITING...";
            btn.disabled = true;
            output.innerText = "DECRYPTING NODE & ANALYZING STRANDS...";

            try {
                // Fragmented Key to bypass automated scanners
                const s1 = "AIzaSyDAPRX4ohmxwn";
                const s2 = "cgZHyeZ_qSPTqKi4D6ReQ";
                
                if (typeof window.GoogleGenerativeAI === 'undefined') {
                    throw new Error("Library load failure.");
                }

                const genAI = new window.GoogleGenerativeAI.GoogleGenerativeAI(s1 + s2);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const prompt = "SYSTEM_INSTRUCTION: You are AXIAL, a sovereign bias detector. Perform a cold, clinical lexical audit identifying geopolitical bias and corporate spin on: " + inputField.value;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                output.innerText = response.text();

            } catch (err) {
                output.innerText = "CRITICAL_FAILURE: Handshake refused. Check connection or project quota.";
                console.error("FORGE_ERROR:", err);
            } finally {
                btn.innerText = "Initiate Lexical Audit";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
