<script>
const BIAS_DB = {
    geopolitical: ["unprovoked", "regime", "militant", "freedom fighter", "surgical strike", "collateral damage"],
    corporate: ["synergy", "pivotal", "market-leading", "disruptive", "stakeholder", "alignment"],
    emotional: ["outrageous", "shocking", "common sense", "everyone knows", "vicious"]
};

function runLocalAudit() {
    const input = document.getElementById("axial-input").value.toLowerCase();
    const output = document.getElementById("axial-output");
    let findings = [];

    // Audit Geopolitical Strands
    BIAS_DB.geopolitical.forEach(word => {
        if (input.includes(word)) findings.push(`[GEOPOLITICAL_SIGNAL]: "${word}"`);
    });

    // Audit Corporate Spin
    BIAS_DB.corporate.forEach(word => {
        if (input.includes(word)) findings.push(`[CORPORATE_SPIN]: "${word}"`);
    });

    if (findings.length > 0) {
        output.innerHTML = "<strong>AUDIT COMPLETE: High Probability of Bias Detected.</strong><br><br>" + findings.join("<br>");
    } else {
        output.innerText = "NO IMMEDIATE LEXICAL SIGNALS DETECTED. PROCEED WITH CAUTION.";
    }
}
</script>
