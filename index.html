<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND.SET | AXIAL AUDIT ENGINE</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #0a0a0a;
            --panel-bg: #141414;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #333;
            text-align: center;
            letter-spacing: 5px;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }

        #axial-terminal {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        #business-node {
            flex: 1;
            border-left: 1px solid var(--neon-green);
        }

        .status-bar {
            background: #000;
            padding: 5px 15px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
        }

        input, button {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            margin-top: 10px;
            font-family: inherit;
        }

        button:hover {
            background: var(--neon-green);
            color: black;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>MIND.SET // AXIAL</h1>
</header>

<div class="container">
    <section id="axial-terminal" class="panel">
        <h3>HEURISTIC NARRATIVE AUDIT</h3>
        <div id="output" style="flex: 1; color: var(--text-gray);">
            [SYSTEM READY... STANDING BY FOR INPUT]
        </div>
        <input type="text" id="audit-input" placeholder="Enter narrative string for analysis...">
        <button onclick="runAudit()">RUN AXIAL AUDIT</button>
    </section>

    <section id="business-node" class="panel">
        <h3>INFRASTRUCTURE DEFENSE</h3>
        <p style="font-size: 0.9rem; color: var(--text-gray);">Contact for sovereign system integration or deployment queries.</p>
        <form id="contact-form">
            <input type="text" placeholder="Identity" style="width: 90%;">
            <input type="email" placeholder="Secure Email" style="width: 90%;">
            <textarea placeholder="Inquiry Details" style="width: 90%; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); margin-top: 10px; height: 100px; font-family: inherit;"></textarea>
            <button type="button" style="width: 96%;">SUBMIT INQUIRY</button>
        </form>
    </section>
</div>

<div class="status-bar">
    <div>SYSTEM_STATUS: <span id="status-display">INITIALIZING...</span></div>
    <div>NODE_LOCATION: SAN ANTONIO, TX</div>
</div>

<script>
    // THE FIX: Auto-Bridge for Public/Local Environments
    const API_KEY = "REPLACED_FOR_SECURITY"; // Secure this in your console!

    window.onload = function() {
        const status = document.getElementById('status-display');
        const output = document.getElementById('output');
        
        // Detect environment
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        if (isLocal) {
            status.innerText = "LOCAL SYSTEM ACTIVE";
            status.style.color = "#00ff41";
            console.log("Axial: Local dev node engaged.");
        } else {
            // Public "Safety Net"
            status.innerText = "SOVEREIGN NODE: ONLINE (DEMO)";
            status.style.color = "#00ff41";
            output.innerHTML += "<br>> Remote access detected.<br>> Initializing public-facing heuristic sandbox...<br>> Ready.";
        }
    };

    function runAudit() {
        const input = document.getElementById('audit-input').value;
        const output = document.getElementById('output');

        if (!input) return;

        output.innerHTML += `<br><br><span style="color:white;">[USER]: ${input}</span>`;
        output.innerHTML += `<br>> Analyzing narrative weights...`;
        
        // Simulated Axial Logic for Public Users
        setTimeout(() => {
            output.innerHTML += `<br>> <span style="color:var(--neon-green);">[RESULT]: Heuristic integrity confirmed. No mechanical clichés detected.</span>`;
            document.getElementById('audit-input').value = "";
            output.scrollTop = output.scrollHeight;
        }, 1000);
    }
</script>

</body>
</html>
